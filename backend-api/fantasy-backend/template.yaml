AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  fantasy-backend

  Dynasuiiii Analytics - Dynasty league dashboard backend
  Includes: DynamoDB (on-demand), Dashboard API, Ingestion Lambda,
  Enrichment Lambda with pandas/numpy layer.
  Ingestion and enrichment schedules are disabled while the Lambda
  migration is paused.

Globals:
  Function:
    Timeout: 30

Resources:
  # ============================================================
  # DynamoDB Table - ON-DEMAND (PAY_PER_REQUEST)
  # Provisioned 25 RCU/WCU was free for the table, but the GSI1
  # index consumed a second 25/25 that the free tier does NOT
  # cover (25 total per account, not per index) -- roughly
  # $14/month. On-demand bills per request instead; at current
  # volume (~453 requests/month) that rounds to $0.
  # ============================================================
  DashboardDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: fantasy-dashboard-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Environment
          Value: production
        - Key: Application
          Value: fantasy-dashboard

  # ============================================================
  # Lambda Layer: pandas + numpy (Python 3.14, arm64)
  # Task 1.6: Build with ./build-layer.sh
  # The zip MUST be rebuilt whenever the runtime changes: pandas
  # and numpy ship compiled extensions tagged to one CPython ABI
  # (cpython-314-aarch64-linux-gnu), so a 3.11-built zip cannot
  # be imported by a 3.14 function.
  # ============================================================
  PandasNumpyLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: pandas-numpy-layer
      Description: pandas and numpy for enrichment pipeline (Python 3.14, arm64)
      ContentUri: layers/pandas-numpy-layer.zip
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - arm64
      # Retain, not Delete: a runtime change publishes a NEW layer version and
      # repoints the functions at it. Delete would let CloudFormation remove
      # the previous (python3.11) version, destroying the only rollback path.
      # Retain keeps v1 alive so functions can be pointed back at it if the
      # 3.14 layer fails to import on real arm64. Cost of keeping it: ~41 MB
      # against the 75 GB account code-storage limit, i.e. negligible. Prune
      # old versions manually once 3.14 is confirmed working in production.
      RetentionPolicy: Retain

  # ============================================================
  # Dashboard API Lambda (read endpoints)
  # ============================================================
  DashboardApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dashboard_api/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - arm64
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref DashboardDataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DashboardDataTable
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /api/{proxy+}
            Method: ANY

  # ============================================================
  # Ingestion Lambda (hourly, raw Sleeper data -> DynamoDB)
  # ============================================================
  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ingestion_lambda/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - arm64
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref DashboardDataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DashboardDataTable
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Fetch Sleeper data and update DynamoDB every hour
            # Disabled: Lambda migration is paused (VITE_USE_LAMBDA_API=false)
            # and nothing reads this table. Flip to true to resume ingestion.
            Enabled: false

  # ============================================================
  # Enrichment Lambda (daily cron, STUB until Task 2.1)
  # Reads raw DynamoDB data, runs pipeline stages 2-5,
  # writes 7 ENRICHED_*#LATEST items
  # ============================================================
  EnrichmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: enrichment_lambda/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - arm64
      Timeout: 900
      MemorySize: 1024
      Layers:
        - !Ref PandasNumpyLayer
      Environment:
        Variables:
          TABLE_NAME: !Ref DashboardDataTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DashboardDataTable
      Events:
        DailyEnrichment:
          Type: Schedule
          Properties:
            Schedule: cron(0 10 * * ? *)
            Description: Run enrichment pipeline daily after ingestion
            # Disabled alongside the hourly ingestion schedule above.
            Enabled: false

Outputs:
  DashboardApiUrl:
    Description: "API Gateway endpoint URL for dashboard API"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/api/"
  DashboardApiFunction:
    Description: "Dashboard API Lambda Function ARN"
    Value: !GetAtt DashboardApiFunction.Arn
  DashboardApiFunctionIamRole:
    Description: "IAM Role for Dashboard API function"
    Value: !GetAtt DashboardApiFunctionRole.Arn
  DashboardDataTableName:
    Description: "DynamoDB table name for dashboard data"
    Value: !Ref DashboardDataTable
  DashboardDataTableArn:
    Description: "DynamoDB table ARN"
    Value: !GetAtt DashboardDataTable.Arn
  EnrichmentFunctionArn:
    Description: "Enrichment Lambda Function ARN"
    Value: !GetAtt EnrichmentFunction.Arn
  PandasNumpyLayerArn:
    Description: "pandas/numpy Lambda Layer ARN"
    Value: !Ref PandasNumpyLayer
