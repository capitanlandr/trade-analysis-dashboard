name: CI/CD Pipeline

# MANUAL ONLY -- this workflow no longer runs on push.
#
# It was failing on every single push, which is worse than having no CI at all: a
# permanently-red check is invisible, and it is what let a real pipeline failure sit
# unnoticed for 35 days in June 2026.
#
# Six of its seven jobs test code that no longer exists or scripts that were never
# defined:
#   Test Backend / Dependency Check  -> working-directory: dashboard/backend
#                                       (archived as dashboard/backend.ARCHIVED)
#   Test Frontend                    -> npm run lint, npm test  (no such scripts)
#   Code Quality                     -> npm run format:check     (no such script)
#                                       tsc --noEmit is already enforced by the local
#                                       .git/hooks/pre-commit hook
#   Integration Tests / Deploy Preview -> skipped (need the above, or are stubs that
#                                       just echo a fake preview URL)
#
# The seventh, Security Scan, DID work -- Trivy scanned the tree successfully and only
# the SARIF upload failed ("Resource not accessible by integration"), which needs GitHub
# code scanning enabled on the repo. Since this repo is public, that job is the one piece
# with real value (dependency CVEs + secret scanning), so it is kept below and now runs
# on push with the upload made non-fatal.
#
# Real deployment safety lives in the two workflows that actually run:
#   deploy-aws.yml       -- builds the frontend (npx tsc && vite build) and deploys
#   update-dashboard.yml -- runs the data pipeline and surfaces stage warnings
#
# To run the legacy jobs by hand: Actions -> CI/CD Pipeline -> Run workflow.
# To revive them properly: restore dashboard/backend.ARCHIVED, or delete those jobs and
# add lint/test/format:check scripts to dashboard/frontend/package.json.

on:
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: dashboard/backend/package-lock.json
        
    - name: Install backend dependencies
      working-directory: dashboard/backend
      run: npm ci
      
    - name: Run backend linting
      working-directory: dashboard/backend
      run: npm run lint
      
    - name: Run backend tests
      working-directory: dashboard/backend
      run: npm test
      
    - name: Build backend
      working-directory: dashboard/backend
      run: npm run build

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: dashboard/frontend/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: dashboard/frontend
      run: npm ci
      
    - name: Run frontend linting
      working-directory: dashboard/frontend
      run: npm run lint
      
    - name: Run frontend tests
      working-directory: dashboard/frontend
      run: npm test
      
    - name: Build frontend
      working-directory: dashboard/frontend
      run: npm run build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: dashboard/frontend/dist/

  # security-scan job moved to .github/workflows/security-scan.yml so it keeps running
  # on push (it was the only job here that did real work). Do not re-add it here.

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Check backend dependencies
      working-directory: dashboard/backend
      run: |
        npm audit --audit-level=high
        
    - name: Check frontend dependencies
      working-directory: dashboard/frontend
      run: |
        npm audit --audit-level=high

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        cd dashboard/backend && npm ci
        cd ../frontend && npm ci
        
    - name: Run TypeScript check
      run: |
        cd dashboard/backend && npx tsc --noEmit
        cd ../frontend && npx tsc --noEmit
        
    - name: Check code formatting
      run: |
        cd dashboard/backend && npm run format:check
        cd ../frontend && npm run format:check

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        cd dashboard/backend && npm ci
        cd ../frontend && npm ci
        
    - name: Start backend server
      working-directory: dashboard/backend
      run: |
        npm run build
        npm start &
        sleep 10
        
    - name: Run integration tests
      working-directory: dashboard/frontend
      run: npm run test:integration
      
    - name: Stop backend server
      run: pkill -f "node"

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: dashboard/frontend/dist/
        
    - name: Deploy to preview environment
      run: |
        echo "Would deploy to preview environment"
        echo "Preview URL: https://preview-${{ github.event.number }}.example.com"