name: Deploy to AWS

on:
  push:
    branches: [ main ]
    paths:
      - 'dashboard/frontend/**'
      - 'pipeline/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'dashboard/frontend/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd dashboard/frontend
          npm ci
      
      - name: Build production bundle
        run: |
          cd dashboard/frontend
          npm run build
        env:
          # Static JSON is the production data source; the Lambda migration is PAUSED
          # (Lambda data does not yet match pipeline output -- fewer trades, stale team
          # names). Keep this 'false' until parity is verified.
          #
          # Do NOT delete this block and rely on .env.production instead: in Vite, shell
          # env vars take precedence over .env files, so this line -- not the committed
          # default -- decides the deployed mode. Pinning it explicitly keeps this
          # workflow consistent with update-dashboard.yml, which builds the same bundle
          # with no VITE_* overrides.
          VITE_USE_LAMBDA_API: 'false'
          # VITE_API_BASE_URL: 'https://aucuc2yvd4.execute-api.us-east-1.amazonaws.com/Prod'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Sync assets to S3 (with long cache)
        run: |
          cd dashboard/frontend
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"
      
      - name: Sync HTML and JSON to S3 (with short cache)
        run: |
          cd dashboard/frontend
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "public, max-age=3600, must-revalidate"
      
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      
      - name: Deployment summary
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 S3 Bucket: ${{ secrets.AWS_S3_BUCKET }}"
          echo "☁️ CloudFront Distribution: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "🔗 Website: https://$(aws cloudfront get-distribution --id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --query 'Distribution.DomainName' --output text)"
