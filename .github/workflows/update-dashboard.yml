name: Update Dashboard Data

on:
  # Run automatically every day at 9 AM EST (2 PM UTC)
  schedule:
    - cron: '0 14 * * *'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

# Give GitHub Actions permission to push to the repo
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          cd pipeline
          pip install -r requirements.txt
      
      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      
      - name: Run pipeline and update dashboard
        run: |
          python3 update_dashboard.py
        env:
          # Add any environment variables/secrets here if needed
          PYTHONUNBUFFERED: 1

      # Refresh the NFL Top 100 list + roster cross-reference. Idempotent and
      # stdlib-only (no extra pip deps). In CI the data/ cache is not committed,
      # so the script fetches rosters/players from the Sleeper API automatically.
      # On an unreachable/unparseable source it preserves the last good JSON
      # (committed at dashboard/frontend/public/nfl-top-100.json) rather than
      # overwriting it, so a bad fetch never blanks the tab.
      - name: Refresh NFL Top 100 data
        run: |
          python3 scripts/generate_nfl_top100.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Setup Node.js for frontend build
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'dashboard/frontend/package-lock.json'
      
      - name: Install frontend dependencies
        run: |
          cd dashboard/frontend
          npm ci
      
      # VITE_USE_LAMBDA_API is injected here, NOT read from .env.production --
      # that file is gitignored (dashboard/.gitignore) and was never committed,
      # so it does not exist in CI and Vite would silently default the flag to
      # false. Vite inlines VITE_-prefixed env vars at build time, so exporting
      # them for `npm run build` bakes them into the bundle.
      #
      # Controlled by the repo variable USE_LAMBDA_API (set to 'true' on
      # 2026-08-03 after 8/8 route parity was verified against live AWS). Set it
      # back to 'false' and re-run to revert to static JSON -- the pipeline still
      # writes /public/*.json every run, so the fallback stays warm.
      - name: Build production bundle
        run: |
          cd dashboard/frontend
          npm run build
        env:
          VITE_USE_LAMBDA_API: ${{ vars.USE_LAMBDA_API }}
          VITE_API_BASE_URL: https://aucuc2yvd4.execute-api.us-east-1.amazonaws.com/Prod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Deploy to AWS S3
        run: |
          cd dashboard/frontend
          # Upload assets with long cache
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"
          
          # Upload HTML and JSON with short cache
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "public, max-age=3600, must-revalidate"
      
      # Publishes the dashboard JSON to DynamoDB so the Lambda API can serve it.
      #
      # A separate step rather than folded into "Run pipeline and update dashboard"
      # because that step runs BEFORE aws-actions/configure-aws-credentials, so a
      # DynamoDB write inside it would have no credentials. Being separate also
      # makes the publish re-runnable without re-running the whole pipeline.
      #
      # Calls stage13 directly rather than `update_dashboard.py --publish-dynamodb`
      # because that would re-execute all 17 pipeline stages. The artifacts in
      # dashboard/frontend/public/ were already produced and gated by
      # verify_dashboard_files() in the earlier step, which is the same
      # completeness guarantee the --publish-dynamodb path provides -- so calling
      # the stage directly here is equivalent, minus the duplicate work. That
      # ordering dependency is why this step must stay after the pipeline step.
      #
      # DISABLED BY DEFAULT: set the repo variable PUBLISH_DYNAMODB to 'true' to
      # enable. Until then the wiring is in place but dormant, so merging this
      # changes nothing about the daily run.
      #
      # Non-fatal on purpose: production is still served from the static JSON
      # synced to S3 above, so a failed publish to a table nothing reads yet must
      # not block the dashboard from updating. WHEN VITE_USE_LAMBDA_API BECOMES
      # 'true' IN PRODUCTION, remove the `|| echo` fallback and the
      # continue-on-error so a stale table fails the workflow loudly.
      - name: Publish data to DynamoDB
        if: vars.PUBLISH_DYNAMODB == 'true'
        continue-on-error: true
        run: |
          cd pipeline
          if python3 stage13_publish_dynamodb.py; then
            echo "✅ DynamoDB publish succeeded"
          else
            echo "::warning title=DynamoDB publish failed::The DynamoDB table is now stale relative to the deployed static files. The live static site is unaffected. Re-run with: cd pipeline && python3 stage13_publish_dynamodb.py"
          fi
        env:
          PYTHONUNBUFFERED: 1

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
      
      - name: Deployment summary
        run: |
          echo "✅ Pipeline completed successfully!"
          echo "📊 Data updated and deployed to:"
          echo "   • Vercel: https://dynasuiiiianalytics.vercel.app (via git push)"
          echo "   • AWS: https://d137gsvp1einvh.cloudfront.net (via S3 sync)"
          echo "🔄 Both sites will show latest data in 3-5 minutes!"
